<svg xmlns="http://www.w3.org/2000/svg" width="900" height="536" viewBox="0 0 900 536" role="img" aria-labelledby="title desc">
  <title id="title">Example devbrief output</title>
  <desc id="desc">A terminal window showing a devbrief: three items to do first, one line per project with a red, yellow or green status, and what changed since the last brief. All projects are fictional.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; font-size: 14px; fill: #c9d1d9; }
    .dim { fill: #8b949e; }
    .h1 { fill: #f0f6fc; font-weight: 700; font-size: 15px; }
    .h2 { fill: #79c0ff; font-weight: 700; }
    .b { fill: #f0f6fc; font-weight: 700; }
    .prompt { fill: #7ee787; }
    .num { fill: #d2a8ff; }
    .add { fill: #f85149; }
    .ok { fill: #3fb950; }
    .tb { fill: #8b949e; font-size: 12px; }
  </style>

  <!-- window -->
  <rect x="0.5" y="0.5" width="899" height="535" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M0.5 36 V10.5 a10 10 0 0 1 10 -10 H889.5 a10 10 0 0 1 10 10 V36 Z" fill="#161b22"/>
  <line x1="0.5" y1="36" x2="899.5" y2="36" stroke="#30363d"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="450" y="22" text-anchor="middle" class="tb">claude  ·  ~/code</text>

  <!-- prompt -->
  <text x="24" y="66"><tspan class="prompt">&gt;</tspan> /devbrief</text>

  <!-- title -->
  <text x="24" y="100" class="h1"># devbrief · 2026-10-26</text>

  <!-- do first -->
  <text x="24" y="134" class="h2">## Do first</text>
  <text x="24" y="160"><tspan class="num">1.</tspan> <tspan class="b">pixel-quest: push your work.</tspan> <tspan class="dim">4 commits exist only on this laptop (no remote).</tspan></text>
  <text x="24" y="184"><tspan class="num">2.</tspan> <tspan class="b">shop-api: fix the failing CI.</tspan> <tspan class="dim">"test" has failed on main since yesterday.</tspan></text>
  <text x="24" y="208"><tspan class="num">3.</tspan> <tspan class="b">recipes-app: write the pricing page.</tspan> <tspan class="dim">Top item under "Next" in STATUS.md.</tspan></text>

  <!-- projects -->
  <text x="24" y="246" class="h2">## Projects</text>
  <circle cx="31" cy="267" r="5" fill="#f85149"/>
  <text x="44" y="272"><tspan class="b">pixel-quest</tspan><tspan x="170">4 commits on no remote, then "Add the level select screen" <tspan class="dim">(docs/NEXT.md)</tspan></tspan></text>
  <circle cx="31" cy="291" r="5" fill="#f85149"/>
  <text x="44" y="296"><tspan class="b">shop-api</tspan><tspan x="170">CI failing on main, then "Add rate limits" <tspan class="dim">(STATUS.md)</tspan></tspan></text>
  <circle cx="31" cy="315" r="5" fill="#d29922"/>
  <text x="44" y="320"><tspan class="b">landing</tspan><tspan x="170">3 commits behind origin, pull before you start</tspan></text>
  <circle cx="31" cy="339" r="5" fill="#d29922"/>
  <text x="44" y="344"><tspan class="b">recipes-app</tspan><tspan x="170">1 open PR waiting, then "Write the pricing page"</tspan></text>
  <circle cx="31" cy="363" r="5" fill="#3fb950"/>
  <text x="44" y="368"><tspan class="b">weather-bot</tspan><tspan x="170">healthy, next is "Add hourly alerts" <tspan class="dim">(TODO.md)</tspan></tspan></text>
  <text x="44" y="392" class="dim">Quiet: old-prototype, dotfiles</text>

  <!-- since last brief -->
  <text x="24" y="430" class="h2">## Since last brief <tspan class="dim" font-weight="400">(2026-10-25)</tspan></text>
  <text x="24" y="456"><tspan class="add">+</tspan> shop-api: new <tspan class="b">ci-failing</tspan></text>
  <text x="24" y="480"><tspan class="ok">✓</tspan> landing: resolved <tspan class="b">unpushed</tspan></text>
  <text x="24" y="504"><tspan class="ok">✓</tspan> weather-bot: resolved <tspan class="b">behind</tspan></text>
</svg>
