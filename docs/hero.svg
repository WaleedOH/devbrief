<g class="k0"><text x="24" y="100" class="h1"># devbrief · 2026-10-26</text></g>
<g class="k1"><rect x="16" y="114" width="868" height="96" rx="6" class="hl"/><rect x="16" y="114" width="3" height="96" class="hlbar"/><text x="32" y="136" class="ns">Night shift: 2 draft PRs ready for review, 1 task stopped without a PR</text></g>
<g class="k2"><text x="32" y="160"><tspan class="dim">-</tspan> <tspan class="b">shop-api</tspan>: Add request IDs to error logs <tspan class="dim">(draft PR #41)</tspan></text></g>
<g class="k3"><text x="32" y="180"><tspan class="dim">-</tspan> <tspan class="b">recipes-app</tspan>: Update 3 dependencies to their latest patch versions <tspan class="dim">(draft PR #18)</tspan></text></g>
<g class="k4"><text x="32" y="200"><tspan class="dim">-</tspan> <tspan class="b">landing</tspan>: stopped, tests failed after the change <tspan class="dim">(2 of 48), no PR opened</tspan></text></g>
<g class="k5"><text x="24" y="240" class="h2">## Do first</text></g>
<g class="k6"><text x="24" y="266"><tspan class="num">1.</tspan> <tspan class="b">pixel-quest: Push your work (4 commits).</tspan> <tspan class="dim">Only on this laptop, on no remote.</tspan></text></g>
