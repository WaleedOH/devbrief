<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">devbrief in action</title>
<desc id="desc">An animated terminal: someone types /devbrief, and a brief appears line by line. It opens with the night shift's results (2 draft PRs ready for review, 1 task stopped because its tests failed), then three things to do first, then one line per project marked red, yellow or green. All projects are fictional.</desc>
