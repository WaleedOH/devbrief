<g class="k10"><circle cx="31" cy="371" r="5" fill="#f85149"/><text x="44" y="376"><tspan class="b">pixel-quest</tspan><tspan x="170">4 commits on no remote → push, then "Add the level select screen"</tspan></text></g>
<g class="k11"><circle cx="31" cy="395" r="5" fill="#f85149"/><text x="44" y="400"><tspan class="b">landing</tspan><tspan x="170">CI "test" failing on main → fix the signup form tests</tspan></text></g>
<g class="k12"><circle cx="31" cy="419" r="5" fill="#d29922"/><text x="44" y="424"><tspan class="b">recipes-app</tspan><tspan x="170">status doc may be out of date → /devbrief wrap; draft PR #18 waiting</tspan></text></g>
<g class="k13"><circle cx="31" cy="443" r="5" fill="#3fb950"/><text x="44" y="448"><tspan class="b">shop-api</tspan><tspan x="170">draft PR #41 waiting; next is "Add rate limits to /checkout"<tspan class="age"> (next for 6 days)</tspan></tspan></text></g>
